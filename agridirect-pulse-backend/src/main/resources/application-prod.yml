spring:
  datasource:
    url: ${RAILWAY_DATABASE_URL}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
logging:
  level:
    root: WARN
    com.agridirect: INFO
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
